<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core">

    <ui:composition template="/template.xhtml">
        <ui:define name="title">
            <h:outputText value="#{bundle.ViewAdministracionTitle}"></h:outputText>
        </ui:define>
        <ui:define name="body">
            <h:panelGroup id="messagePanel" layout="block">
                <h:messages errorStyle="color: red" infoStyle="color: green" layout="table"/>
            </h:panelGroup>
            <h:form>
                <h:panelGrid columns="2">
                    <h:outputText value="#{bundle.ViewAdministracionLabel_idTrabajador}"/>
                    <h:outputText value="#{administracionController.selected.idTrabajador}" title="#{bundle.ViewAdministracionTitle_idTrabajador}"/>
                    <h:outputText value="#{bundle.ViewAdministracionLabel_nombre}"/>
                    <h:outputText value="#{administracionController.selected.nombre}" title="#{bundle.ViewAdministracionTitle_nombre}"/>
                    <h:outputText value="#{bundle.ViewAdministracionLabel_cargo}"/>
                    <h:outputText value="#{administracionController.selected.cargo}" title="#{bundle.ViewAdministracionTitle_cargo}"/>
                    <h:outputText value="#{bundle.ViewAdministracionLabel_telefono}"/>
                    <h:outputText value="#{administracionController.selected.telefono}" title="#{bundle.ViewAdministracionTitle_telefono}"/>
                    <h:outputText value="#{bundle.ViewAdministracionLabel_sede}"/>
                    <h:outputText value="#{administracionController.selected.sede}" title="#{bundle.ViewAdministracionTitle_sede}"/>
                    <h:outputText value="#{bundle.ViewAdministracionLabel_correo}"/>
                    <h:outputText value="#{administracionController.selected.correo}" title="#{bundle.ViewAdministracionTitle_correo}"/>
                </h:panelGrid>
                <br />
                <h:commandLink action="#{administracionController.destroyAndView}" value="#{bundle.ViewAdministracionDestroyLink}"/>
                <br />
                <br />
                <h:link outcome="Edit" value="#{bundle.ViewAdministracionEditLink}"/>
                <br />
                <h:commandLink action="#{administracionController.prepareCreate}" value="#{bundle.ViewAdministracionCreateLink}" />
                <br />
                <h:commandLink action="#{administracionController.prepareList}" value="#{bundle.ViewAdministracionShowAllLink}"/>
                <br />
                <br />
                <h:link outcome="/index" value="#{bundle.ViewAdministracionIndexLink}"/>

            </h:form>
        </ui:define>
    </ui:composition>

</html>
