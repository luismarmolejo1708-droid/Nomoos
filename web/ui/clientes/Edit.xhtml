<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core">

    <ui:composition template="/template.xhtml">
        <ui:define name="title">
            <h:outputText value="#{bundle.EditClientesTitle}"></h:outputText>
        </ui:define>
        <ui:define name="body">
            <h:panelGroup id="messagePanel" layout="block">
                <h:messages errorStyle="color: red" infoStyle="color: green" layout="table"/>
            </h:panelGroup>
            <h:form>
                <h:panelGrid columns="2">
                    <h:outputLabel value="#{bundle.EditClientesLabel_idRegistro}" for="idRegistro" />
                    <h:inputText id="idRegistro" value="#{clientesController.selected.idRegistro}" title="#{bundle.EditClientesTitle_idRegistro}" required="true" requiredMessage="#{bundle.EditClientesRequiredMessage_idRegistro}"/>
                    <h:outputLabel value="#{bundle.EditClientesLabel_nombre}" for="nombre" />
                    <h:inputText id="nombre" value="#{clientesController.selected.nombre}" title="#{bundle.EditClientesTitle_nombre}" required="true" requiredMessage="#{bundle.EditClientesRequiredMessage_nombre}"/>
                    <h:outputLabel value="#{bundle.EditClientesLabel_telefono}" for="telefono" />
                    <h:inputText id="telefono" value="#{clientesController.selected.telefono}" title="#{bundle.EditClientesTitle_telefono}" required="true" requiredMessage="#{bundle.EditClientesRequiredMessage_telefono}"/>
                    <h:outputLabel value="#{bundle.EditClientesLabel_tipoServicio}" for="tipoServicio" />
                    <h:inputText id="tipoServicio" value="#{clientesController.selected.tipoServicio}" title="#{bundle.EditClientesTitle_tipoServicio}" required="true" requiredMessage="#{bundle.EditClientesRequiredMessage_tipoServicio}"/>
                    <h:outputLabel value="#{bundle.EditClientesLabel_valor}" for="valor" />
                    <h:inputText id="valor" value="#{clientesController.selected.valor}" title="#{bundle.EditClientesTitle_valor}" required="true" requiredMessage="#{bundle.EditClientesRequiredMessage_valor}"/>
                    <h:outputLabel value="#{bundle.EditClientesLabel_correo}" for="correo" />
                    <h:inputText id="correo" value="#{clientesController.selected.correo}" title="#{bundle.EditClientesTitle_correo}" required="true" requiredMessage="#{bundle.EditClientesRequiredMessage_correo}"/>
                    <h:outputLabel value="#{bundle.EditClientesLabel_id}" for="id" />
                    <h:inputText id="id" value="#{clientesController.selected.id}" title="#{bundle.EditClientesTitle_id}" required="true" requiredMessage="#{bundle.EditClientesRequiredMessage_id}"/>
                    <h:outputLabel value="#{bundle.EditClientesLabel_sede}" for="sede" />
                    <h:inputText id="sede" value="#{clientesController.selected.sede}" title="#{bundle.EditClientesTitle_sede}" required="true" requiredMessage="#{bundle.EditClientesRequiredMessage_sede}"/>
                    <h:outputLabel value="#{bundle.EditClientesLabel_fecha}" for="fecha" />
                    <h:inputText id="fecha" value="#{clientesController.selected.fecha}" title="#{bundle.EditClientesTitle_fecha}" required="true" requiredMessage="#{bundle.EditClientesRequiredMessage_fecha}">
                        <f:convertDateTime pattern="MM/dd/yyyy" />
                    </h:inputText>
                </h:panelGrid>
                <h:commandLink action="#{clientesController.update}" value="#{bundle.EditClientesSaveLink}"/>
                <br />
                <br />
                <h:link outcome="View" value="#{bundle.EditClientesViewLink}"/>
                <br />
                <h:commandLink action="#{clientesController.prepareList}" value="#{bundle.EditClientesShowAllLink}" immediate="true"/>
                <br />
                <br />
                <h:link outcome="/index" value="#{bundle.EditClientesIndexLink}" />
            </h:form>
        </ui:define>
    </ui:composition>

</html>
