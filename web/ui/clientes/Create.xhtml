<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core">

    <ui:composition template="/template.xhtml">
        <ui:define name="title">
            <h:outputText value="#{bundle.CreateClientesTitle}"></h:outputText>
        </ui:define>
        <ui:define name="body">
            <h:panelGroup id="messagePanel" layout="block">
                <h:messages errorStyle="color: red" infoStyle="color: green" layout="table"/>
            </h:panelGroup>
            <h:form>
                <h:panelGrid columns="2">
                    <h:outputLabel value="#{bundle.CreateClientesLabel_idRegistro}" for="idRegistro" />
                    <h:inputText id="idRegistro" value="#{clientesController.selected.idRegistro}" title="#{bundle.CreateClientesTitle_idRegistro}" required="true" requiredMessage="#{bundle.CreateClientesRequiredMessage_idRegistro}"/>
                    <h:outputLabel value="#{bundle.CreateClientesLabel_nombre}" for="nombre" />
                    <h:inputText id="nombre" value="#{clientesController.selected.nombre}" title="#{bundle.CreateClientesTitle_nombre}" required="true" requiredMessage="#{bundle.CreateClientesRequiredMessage_nombre}"/>
                    <h:outputLabel value="#{bundle.CreateClientesLabel_telefono}" for="telefono" />
                    <h:inputText id="telefono" value="#{clientesController.selected.telefono}" title="#{bundle.CreateClientesTitle_telefono}" required="true" requiredMessage="#{bundle.CreateClientesRequiredMessage_telefono}"/>
                    <h:outputLabel value="#{bundle.CreateClientesLabel_tipoServicio}" for="tipoServicio" />
                    <h:inputText id="tipoServicio" value="#{clientesController.selected.tipoServicio}" title="#{bundle.CreateClientesTitle_tipoServicio}" required="true" requiredMessage="#{bundle.CreateClientesRequiredMessage_tipoServicio}"/>
                    <h:outputLabel value="#{bundle.CreateClientesLabel_valor}" for="valor" />
                    <h:inputText id="valor" value="#{clientesController.selected.valor}" title="#{bundle.CreateClientesTitle_valor}" required="true" requiredMessage="#{bundle.CreateClientesRequiredMessage_valor}"/>
                    <h:outputLabel value="#{bundle.CreateClientesLabel_correo}" for="correo" />
                    <h:inputText id="correo" value="#{clientesController.selected.correo}" title="#{bundle.CreateClientesTitle_correo}" required="true" requiredMessage="#{bundle.CreateClientesRequiredMessage_correo}"/>
                    <h:outputLabel value="#{bundle.CreateClientesLabel_id}" for="id" />
                    <h:inputText id="id" value="#{clientesController.selected.id}" title="#{bundle.CreateClientesTitle_id}" required="true" requiredMessage="#{bundle.CreateClientesRequiredMessage_id}"/>
                    <h:outputLabel value="#{bundle.CreateClientesLabel_sede}" for="sede" />
                    <h:inputText id="sede" value="#{clientesController.selected.sede}" title="#{bundle.CreateClientesTitle_sede}" required="true" requiredMessage="#{bundle.CreateClientesRequiredMessage_sede}"/>
                    <h:outputLabel value="#{bundle.CreateClientesLabel_fecha}" for="fecha" />
                    <h:inputText id="fecha" value="#{clientesController.selected.fecha}" title="#{bundle.CreateClientesTitle_fecha}" required="true" requiredMessage="#{bundle.CreateClientesRequiredMessage_fecha}">
                        <f:convertDateTime pattern="MM/dd/yyyy" />
                    </h:inputText>
                </h:panelGrid>
                <br />
                <h:commandLink action="#{clientesController.create}" value="#{bundle.CreateClientesSaveLink}" />
                <br />
                <br />
                <h:commandLink action="#{clientesController.prepareList}" value="#{bundle.CreateClientesShowAllLink}" immediate="true"/>
                <br />
                <br />
                <h:link outcome="/index" value="#{bundle.CreateClientesIndexLink}"/>
            </h:form>
        </ui:define>
    </ui:composition>

</html>
